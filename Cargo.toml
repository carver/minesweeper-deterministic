[package]
name = "minesweeper-deterministic"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "persistence", "wayland", "wgpu", "x11"] }
# Not used directly: its GNOME-style title bar is off unless eframe's default
# features are on, and Wayland windows otherwise get plain square buttons.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
proptest = "1.11.0"

[profile.release]
strip = true
lto = "thin"

# Light optimisation for this crate keeps the solver-heavy tests quick while
# still debuggable. Dependencies get more, and no debug info, which keeps
# target/ small on the slow shared mount.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
